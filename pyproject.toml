[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protobridge"
version = "1.0.0"
description = "Real-Time Full-Duplex Tactical Voice Translator & Stealth Voice Cloner"
authors = [
    { name = "Jhon Córdova Martínez (Cresko)", email = "jhon.a.cordova.martinez@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26.4",
    "PyAudioWPatch>=0.2.12.6",
    "soxr>=0.3.7",
    "onnxruntime>=1.20.1",
    "faster-whisper>=1.1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "kokoro-onnx>=0.4.0",
    "ctranslate2>=4.0.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.20.0"
]

[project.scripts]
protobridge = "protobridge.main:main"
protobridge-calibrate = "protobridge.calibrate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["protobridge*"]
