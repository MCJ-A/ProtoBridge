name: Ignait CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy PyAudioWPatch soxr onnxruntime faster-whisper kokoro-onnx ctranslate2 tokenizers huggingface-hub Pillow pytest
          pip install -e . --no-deps
      - name: Run Ignait Test Suite
        run: |
          pytest -v
          python -m unittest discover -s tests -v
